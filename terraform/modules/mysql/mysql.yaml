spec:
  containers:
    - name: mysql
      image: mysql:${version}
      env:
        - name: MYSQL_RANDOM_ROOT_PASSWORD
          value: "yes"
        - name: MYSQL_DATABASE
          value: "fleet"
        - name: MYSQL_USER
          value: "fleet"
        - name: MYSQL_PASSWORD
          value: "${password}"
      stdin: false
      tty: false
      volumeMounts:
        - name: disk-storage
          mountPath: /var/lib/mysql
  volumes:
    - name: disk-storage
      hostPath:
        path: /mnt/stateful_partition/mysql
  restartPolicy: Always